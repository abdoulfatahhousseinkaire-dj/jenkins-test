- name: Supprimer l'ancien service si existant
  win_shell: |
    $svc = Get-Service -Name "Promtail" -ErrorAction SilentlyContinue
    if ($svc) {
      Stop-Service -Name "Promtail" -Force -ErrorAction SilentlyContinue
      sc.exe delete Promtail
      Start-Sleep -Seconds 2
    }

- name: Installer Promtail comme service Windows
  win_shell: |
    sc.exe create Promtail `
      binPath= "\"C:\promtail\promtail-windows-amd64.exe\" -config.file=\"C:\promtail\promtail-config.yml\"" `
      start= auto `
      DisplayName= "Promtail Log Agent"

- name: Configurer la description du service
  win_shell: |
    sc.exe description Promtail "Agent Promtail - envoi logs vers Loki"

- name: Démarrer Promtail
  win_shell: |
    Start-Sleep -Seconds 1
    Start-Service -Name "Promtail"

- name: Vérifier que Promtail tourne
  win_shell: |
    $svc = Get-Service -Name "Promtail"
    Write-Output $svc.Status
  register: svc_status

- name: Afficher le statut
  debug:
    msg: "Promtail status : {{ svc_status.stdout }}"